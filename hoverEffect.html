<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        .hover-effect {
            position: relative;
            display: inline-block;
        }

            .hover-effect:after {
                content: "";
                position: absolute;
                bottom: -5px;
                left: 0;
                right: 0;
                height: 2px;
                background-color: #000;
                visibility: hidden;
                transform: scaleX(0);
                transition: all 0.3s ease-in-out 0s;
            }

            .hover-effect:hover:after {
                visibility: visible;
                transform: scaleX(1);
            }

    </style>
</head>
<body>
    <p class="hover-effect">Hover over me</p>

</body>
</html>
