<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>

        p {
            position: relative;
        }

            p:before {
                content: "";
                position: absolute;
                width: 100%;
                height: 2px;
                bottom: -10px;
                left: 0;
                background-color: #000;
                visibility: hidden;
                transform: scaleX(0);
                transition: all 0.3s ease-in-out 0s;
            }

            p:hover:before {
                visibility: visible;
                transform: scaleX(1);
            }
    </style>
    

</head>
<body>
    <p class="hover-effect">Hover over me</p>
</body>
</html>
